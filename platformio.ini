; =============================================================================
; Monorepo Quadricóptero 450 mm DIY — ESP32-S3 (Flight Core + SITL + Hardware)
; =============================================================================

[platformio]
default_envs = native_test

; -----------------------------------------------------------------------------
; 1. Ambiente de Testes Unitários no PC (C++17 Puro, < 1s de compilação)
;    Comando: pio test -e native_test
; -----------------------------------------------------------------------------
[env:native_test]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -O2
    -pthread
    -DFC_NATIVE_BUILD=1
test_build_src = false
lib_ignore =
    hal_esp32s3

; -----------------------------------------------------------------------------
; 2. Simulador Físico 6-DoF no PC (SITL + Servidor UDP MAVLink :14550)
;    (Ativado na Sprint 4)
; -----------------------------------------------------------------------------
[env:sitl_pc]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -O2
    -pthread
    -DFC_SITL_BUILD=1
build_src_filter =
    +<sitl_pc/*>
lib_ignore =
    hal_esp32s3

; -----------------------------------------------------------------------------
; 3. Controladora de Voo — ESP32-S3-DevKitC-1 N16R8 (WROOM-1U / IPEX)
; -----------------------------------------------------------------------------
[env:drone_fc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFC_TARGET_DRONE=1
build_src_filter =
    +<drone_fc/*>
lib_ignore =
    sim_physics

; -----------------------------------------------------------------------------
; 4. Controle Caseiro / Estação Base — ESP32-S3-DevKitC-1 N16R8 (WROOM-1U)
; -----------------------------------------------------------------------------
[env:ground_tx]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFC_TARGET_GROUND_TX=1
build_src_filter =
    +<ground_tx/*>
lib_ignore =
    sim_physics
